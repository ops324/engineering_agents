name: ssos_eclss_loop  # CLI scenario id (`run ssos_eclss_loop`)
description: >
  SSOS ECLSS closed loop. Agents operate ARS/OGS via EclssBackend (Crew Simulation
  replacement). Mock backend for local dev; Ros2EclssBridge for SSOS Docker.
  Mass storage values are kilograms (ROS bridge converts SSOS grams ↔ kg).

simulation:
  steps: 50  # [-] default observation steps (CLI --steps overrides)
  initial_co2_storage_kg: 1.3  # [kg] starting CO2 tank/cabin; plant_sim uses cabin
  initial_o2_storage_kg: 8.0  # [kg] starting O2 tank (above o2_storage_low_kg)
  initial_product_water_l: 80.0  # [L] starting potable water (above product_water_low_l)

backend:
  kind: mock  # mock | plant_sim | ros2 — CLI default is ros2 (needs Docker); or SSOS_ECLSS_BACKEND
  ros2:
    action_timeout_s: 120.0  # [s] wait for a ROS2 action result
    topic_timeout_s: 15.0  # [s] wait for a telemetry topic sample
    startup_wait_s: 45.0  # [s] wait after launch for SSOS nodes

mock_dynamics:  # LoopMock only; plant_sim / ros2 ignore this block
  co2_growth_kg_per_step: 0.06  # [kg/step] CO2 added each step when ARS does not run
  ars_co2_reduction_kg: 0.35  # [kg] CO2 removed by one ARS action at the reference goal
  # Scales ARS reduction with ArsGoal.initial_co2_mass / this reference (D1).
  ars_reference_co2_mass_kg: 1.8  # [kg] ARS scale = goal.initial_co2_mass / this mass
  sabatier_co2_kg_per_water_kg: 2.0  # [-] LoopMock Sabatier CO2 debit per kg OGS water

thresholds:  # storage bands for health + labeled_rule_base triggers
  co2_storage_high_kg: 2.0  # [kg] HIGH: start ARS
  co2_storage_critical_kg: 8.0  # [kg] CRITICAL; plant_sim dwell: 2 steps then n // 2 once
  o2_storage_low_kg: 6.0  # [kg] LOW: start OGS; plant_sim dwell: 2 steps then −1
  o2_storage_critical_kg: 1.0  # [kg] CRITICAL; plant_sim dwell: 1 step then −2 (omit fallback: low * 0.75)
  product_water_low_l: 50.0  # [L] LOW: start WRS
  product_water_critical_l: 25.0  # [L] CRITICAL (unspecified fallback: product_water_low_l * 0.5)

# Canonical plant_sim parameters (source of truth for occupant count and rates).
# Python PlantSimConfig() defaults remain for unit tests / library construction.
plant_sim:
  time:
    step_seconds: 1200  # [s] metabolism / observation interval (20 min)
    # Action quanta. The rated-capacity invariant clamps each to step_seconds, so a
    # quantum longer than a step buys nothing: 4800 runs as 1200 and says so in
    # telemetry (`elapsed_seconds`, `limited_by: rated_step_capacity`). It is kept
    # at 4800 on purpose -- that is what keeps the clamp live in the default config
    # instead of dead code, and it is the entry point for modelling an ARS action as
    # a 4-step commitment (EXP-004).
    ars_operation_seconds: 4800  # [s] ARS action quantum; clamped to step_seconds
    ogs_operation_seconds: 1200  # [s] OGS action quantum
    wrs_operation_seconds: 1200  # [s] WRS action quantum (with wrs.capacity_l_day)
  crew:
    size: 4  # [person] occupant N; must match agents.yaml actor.team.count when actors run
    activity_factor: 1.0  # [-] scales all crew rates (1=nominal, 4=exercise, 0.7=sleep)
    co2_kg_day_person: 1.04  # [kg/day/person] BVAD CO2 generated
    o2_kg_day_person: 0.84  # [kg/day/person] BVAD O2 demanded
    potable_water_kg_day_person: 2.28  # [kg/day/person] BVAD potable water demanded
    urine_kg_day_person: 1.50  # [kg/day/person] urine into the WRS buffer
    condensate_kg_day_person: 0.75  # [kg/day/person] condensate / grey into the WRS buffer
    unrecoverable_water_kg_day_person: 0.03  # [kg/day/person] water that leaves the recovery loop
  ars:
    capacity_kg_day: 4.50  # [kg/day] CO2 removal throughput
    capture_efficiency: 0.83  # [-] fraction of removed CO2 captured (rest is vented)
    reference_goal_co2_kg: 1.80  # [kg] ARS scale = agents ars_goal.initial_co2_mass / this
  ogs:
    max_o2_kg_day: 9.25  # [kg/day] O2 generation cap
  sabatier:
    conversion_efficiency: 1.00  # [-] H2 + captured CO2 → CH4 + H2O
  wrs:
    urine_recovery: 0.98  # [-] potable recovered from urine feed
    grey_recovery: 0.90  # [-] potable recovered from grey / condensate feed
    # Rated feed throughput, the WRS counterpart of ars.capacity_kg_day. Derived,
    # not quoted: NASA states the ISS UPA was sized for "a nominal load of 9 kg/day
    # ... the expected quantity for a 6-crew load" (ICES-2023-097 / ICES-2026-425),
    # and 9.0 is exactly crew.urine_kg_day_person 1.50 x 6 -- so the convention is
    # "the 6-crew load of everything the box takes in". run_wrs merges UPA and WPA
    # into one box fed by urine AND grey, so the same convention gives
    # (1.50 + 0.75) x 6 = 13.5. No NASA source states a WPA design throughput.
    capacity_l_day: 13.5  # [L/day] urine + grey the WRS may process, per rated time
    max_feed_l_per_operation: 10.0  # [L] urine + grey batch cap per WRS action
  survival:
    enabled: true  # plant_sim only; sensitivity sweep leaves this false
    # Band edges attrition reads. Same numbers as `thresholds` above, on
    # purpose -- an operator's alarm and the edge of a lethal band describe one
    # physical situation. They are written twice because `thresholds.*` is in
    # ALLOWED_SET_PARAMETER_TARGETS and this block is not: a proposal that
    # raised co2_storage_high_kg above the trajectory used to stop the run
    # entering any band at all, and deleted the occupants it had just killed
    # while the cabin got measurably worse (EXP-010). Omit a key to fall back
    # to the operational threshold, which is the pre-EXP-010 behaviour.
    bands:
      co2_storage_high_kg: 2.0  # [kg] WARNING edge for dwell
      co2_storage_critical_kg: 8.0  # [kg] CRITICAL edge for dwell
      o2_storage_low_kg: 6.0  # [kg] WARNING edge
      o2_storage_critical_kg: 1.0  # [kg] CRITICAL edge
      product_water_low_l: 50.0  # [L] WARNING edge
      product_water_critical_l: 25.0  # [L] CRITICAL edge
    o2:
      warning_steps: 2  # [steps] consecutive WARNING before loss
      warning_loss: 1  # [person]
      critical_steps: 1  # [steps]
      critical_loss: 2  # [person]
    water:
      warning_steps: 2  # [steps]
      warning_loss: 1  # [person]
      critical_steps: 1  # [steps]
      critical_loss: 1  # [person]
    co2:
      warning_steps: 2  # [steps] consecutive HIGH (below CRITICAL) before loss
      warning_divisor: 4  # once per stay: lost = n // 4
      critical_steps: 2  # [steps]
      critical_divisor: 2  # once per stay: lost = n // 2 (no wipe)

# Optional timed fault injection (scenario layer → EclssBackend.set_subsystem_failure).
# Distinct from scrubber anomalies. Off by default; enable via CLI --inject-failures
# or --set inject_failures=true.
inject_failures: false  # if true, apply the schedule below
subsystem_failures:
  - subsystem: ars  # ars | ogs | wrs
    start_step: 10  # [-] inclusive, 0-based
    end_step: 20  # [-] exclusive
  - subsystem: ogs
    start_step: 20  # [-] inclusive, 0-based
    end_step: 30  # [-] exclusive
  - subsystem: wrs
    start_step: 30  # [-] inclusive, 0-based
    end_step: 40  # [-] exclusive

agents:
  actor:
    mode: none  # none | labeled_rule_base | llm (CLI --actor-mode overrides)
    # After llm deliberation, this many actors may issue operational commands.
    # Rotates from eclss_actor_{step % N}. Clamped to actor.team.count.
    # labeled_rule_base ignores this.
    max_actions_per_step: 2  # [-] llm only: actors allowed to command per step
  design: {}
    # design.mode omitted: inherit actor.mode. Set none to disable post-run design.

output:
  run_id: ssos_eclss_loop_baseline  # none/none (or unspecified)
  run_id_labeled_rule_base: ssos_eclss_loop_labeled_rule_base  # both sides labeled
  run_id_llm: ssos_eclss_loop_llm  # both sides llm
  # Mixed actor/design modes use {scenario}_{actor_mode}_{design_mode}.
